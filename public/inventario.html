<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Item</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/inventario.css">
</head>
<body>

    <aside class="sidebar">
        <h1>Indústrias Wayne</h1>

        <nav>
            <a href="/dashboard.html">Dashboard</a>
            <a href="/inventario.html" class="active">Inventário</a>
        </nav>

        <div id="user-info">
            <p id="nome-usuario"></p>
            <p id="cargo-usuario"></p>
        </div>

        <button id="btn-logout">Sair</button>
    </aside>

    <main class="inventario">
        <section class="painel">
            <h3 id="titulo-formulario">Cadastrar Item</h3>

            <form id="formCadastro">
                <label for="nomeItem">Nome</label>
                <input type="text" id="nomeItem">

                <label for="categoriaItem">Categoria</label>
                <select id="categoriaItem">
                    <option value="">Selecione...</option>
                    <option value="Equipamento">Equipamento</option>
                    <option value="Dispositivo de segurança">Dispositivo de segurança</option>
                    <option value="Veículo">Veículo</option>
                </select>

                <label for="quantidadeItem">Quantidade</label>
                <input type="number" id="quantidadeItem">

                <label for="statusItem">Status</label>
                <select id="statusItem">
                    <option value="">Selecione...</option>
                    <option value="Disponível">Disponível</option>
                    <option value="Em manutenção">Em manutenção</option>
                </select>

                <button type="submit" id="btnForm">Cadastrar</button>
                <p id="mensagem-cadastro"></p>
            </form>
        </section>

            <section class="painel">
                <h3>Tabela de Itens</h3>
                <table id="tabelaItens">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Categoria</th>
                            <th>Quantidade</th>
                            <th>Status</th>
                            <th>Ação</th>
                        </tr>
                    </thead>

                    <tbody id="tbody">
                    </tbody>
                </table>
        </section>
    </main>

    <script src="js/geral.js"></script>
    <script src="js/inventario.js"></script>
    
</body>
</html>
